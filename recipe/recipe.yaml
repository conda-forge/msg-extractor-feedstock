schema_version: 1

context:
  name: msg-extractor
  version: "0.58.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/e/extract-msg/extract_msg-${{ version }}.tar.gz
  sha256: 83bc225a0942d80fd97a445c0724e6472b3d821b59df1a5634421bbd19e265fa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - olefile =0.47
    - python >=${{ python_min }}
    - tzlocal >=4.2,<6
    - compressed-rtf >=1.0.6,<2
    - ebcdic >=1.1.1,<2
    - beautifulsoup4 >=4.11.1,<5
    - rtfde >=0.1.1,<0.2
    - red-black-tree-mod =1.20
    - colorclass
    - easygui
    - msoffcrypto-tool
    - pcodedmp
    - pyparsing >=2.1.0,<3

tests:
  - python:
      imports:
        - extract_msg
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: GPL-3.0-only
  license_file: LICENSE.txt
  summary: Extracts emails and attachments saved in Microsoft Outlook's .msg files
  homepage: https://github.com/mattgwwalker/msg-extractor
  repository: https://github.com/mattgwwalker/msg-extractor

extra:
  recipe-maintainers:
    - mxr-conda
    - agcopenhaver
    - rluria14
    - oblute
    - jan-janssen
